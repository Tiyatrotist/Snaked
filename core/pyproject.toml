[project]
name = "snaked-core"
version = "0.1.0"
description = "Snaked agent core: model providers, computer control, safety and the local agent server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
desktop = [
    "pynput>=1.7",
    "mss>=9.0",
    "pillow>=10",
]

[project.scripts]
snaked-core = "snaked_core.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
